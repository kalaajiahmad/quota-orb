name: Bug report
description: Report a reproducible runtime, setup, firmware, or enclosure issue.
title: "bug: "
body:
  - type: markdown
    attributes:
      value: "Do not post credentials, account identifiers, personal paths, raw logs/events, or flash backups. Report security vulnerabilities privately as explained in SECURITY.md."
  - type: textarea
    id: problem
    attributes:
      label: Problem and expected behaviour
      description: Explain the concrete failure and what you expected.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
      description: Give the smallest repeatable sequence using synthetic data where possible.
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions and hardware
      description: Project version, Windows/Python/provider CLI versions, and exact board revision. No account or device identifiers.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Checks and sanitized evidence
      description: Summarize checks already performed. Inspect and redact any attachment before posting.
