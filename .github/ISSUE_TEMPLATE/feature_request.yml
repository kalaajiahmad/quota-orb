name: Feature request
description: Propose a focused improvement with a concrete use case.
title: "feat: "
body:
  - type: textarea
    id: need
    attributes:
      label: Problem or use case
      description: Who needs this, and what cannot they do today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behaviour and validation
      description: Describe the intended behaviour, supported provider interface if relevant, and how it can be tested without private data.
    validations:
      required: true
